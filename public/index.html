<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>超级跳跃工坊</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>

<!-- 手机限制提示 -->
<div id="pcGate" class="pc-gate hidden">
  <div class="pc-gate-box">
    <h2>请用手机打开</h2>
    <p>这个游戏是按手机触屏设计的。<br>请在手机上访问下面的地址：</p>
    <div class="pc-url" id="pcUrl">加载中…</div>
    <p class="dim" id="pcHint">手机和电脑连同一个 Wi-Fi 就能访问。</p>
    <button class="btn ghost" onclick="location.search='?pc=1'">我就是要用电脑试</button>
  </div>
</div>

<!-- 顶部栏 -->
<header id="topbar" class="hidden">
  <button id="btnBack" class="icon-btn" aria-label="返回">‹</button>
  <div id="topTitle">超级跳跃工坊</div>
  <div id="topRight"></div>
</header>

<!-- 首页 -->
<section id="screen-home" class="screen">
  <div class="hero">
    <div class="hero-logo">超级跳跃工坊</div>
    <div class="hero-sub">手机上的开放地图跳跃游戏</div>
  </div>
  <div class="home-actions">
    <button class="btn big" data-go="levels">开始游戏</button>
    <button class="btn big alt" data-go="editor">地图工坊</button>
    <div class="home-row">
      <button class="btn" data-go="leaderboard">排行榜</button>
      <button class="btn" data-go="profile">我的</button>
    </div>
  </div>
  <div class="home-foot" id="homeFoot">加载中…</div>
</section>

<!-- 登录 / 注册 -->
<section id="screen-auth" class="screen hidden">
  <div class="card auth-card">
    <div class="auth-tabs">
      <button class="auth-tab active" data-mode="login">登录</button>
      <button class="auth-tab" data-mode="register">注册</button>
    </div>
    <label class="field">
      <span>用户名</span>
      <input id="authUser" type="text" autocomplete="username" placeholder="2~16 位，可用中文" maxlength="16">
    </label>
    <label class="field">
      <span>密码</span>
      <input id="authPass" type="password" autocomplete="current-password" placeholder="至少 6 位" maxlength="64">
    </label>
    <div id="authErr" class="err"></div>
    <button id="authSubmit" class="btn big">登录</button>
    <p class="dim center small">不登录也能玩别人的地图，但发布地图需要账号。</p>
  </div>
</section>

<!-- 地图列表 -->
<section id="screen-levels" class="screen hidden">
  <div class="search-row">
    <input id="searchInput" type="search" placeholder="输入地图码或地图名搜索" maxlength="24">
    <button id="searchBtn" class="btn small">搜索</button>
  </div>
  <div class="tabs" id="sortTabs">
    <button class="tab active" data-sort="plays">总榜 · 试玩最多</button>
    <button class="tab" data-sort="difficulty">难度榜</button>
    <button class="tab" data-sort="new">最新</button>
  </div>
  <div id="levelList" class="level-list"></div>
</section>

<!-- 排行榜 -->
<section id="screen-leaderboard" class="screen hidden">
  <div class="tabs" id="lbTabs">
    <button class="tab active" data-lb="plays">总榜</button>
    <button class="tab" data-lb="difficulty">难度榜</button>
  </div>
  <div id="lbList" class="level-list"></div>
</section>

<!-- 我的 -->
<section id="screen-profile" class="screen hidden">
  <div class="card profile-card" id="profileBox">
    <div class="avatar-wrap">
      <img id="avatarImg" class="avatar" alt="头像">
      <button id="btnCamera" class="avatar-edit">换头像</button>
    </div>
    <div class="profile-name" id="profileName">未登录</div>
    <div class="profile-stats" id="profileStats"></div>
    <button id="btnLogout" class="btn ghost small">退出登录</button>
  </div>
  <h3 class="sec-title">我发布的地图</h3>
  <div id="myMaps" class="level-list"></div>
</section>

<!-- 游戏 -->
<section id="screen-game" class="screen hidden">
  <canvas id="gameCanvas"></canvas>
  <div class="hud">
    <div class="hud-left">
      <span id="hudCoins">🪙 0</span>
      <span id="hudTime">0.0s</span>
    </div>
    <div class="hud-right">
      <span id="hudName"></span>
      <button id="btnPause" class="icon-btn">❚❚</button>
    </div>
  </div>

  <div class="touch-controls" id="touchControls">
    <div class="dpad">
      <button class="tbtn" id="btnLeft" aria-label="左">◀</button>
      <button class="tbtn" id="btnRight" aria-label="右">▶</button>
    </div>
    <div class="jump-side">
      <button class="tbtn jump" id="btnJump" aria-label="跳">跳</button>
    </div>
  </div>

  <div class="overlay hidden" id="gameOverlay">
    <div class="overlay-box" id="gameOverlayBox"></div>
  </div>
</section>

<!-- 编辑器 -->
<section id="screen-editor" class="screen hidden">
  <canvas id="editCanvas"></canvas>
  <div class="edit-toolbar" id="editToolbar">
    <div class="palette" id="palette"></div>
    <div class="edit-meta">
      <input id="mapName" type="text" placeholder="给地图起个名字" maxlength="24">
      <div class="edit-btns">
        <button class="btn small ghost" id="btnTest">试玩</button>
        <button class="btn small ghost" id="btnClear">清空</button>
        <button class="btn small" id="btnPublish">发布</button>
      </div>
    </div>
    <div class="edit-tools">
      <button class="btn small ghost" id="btnMode">✋ 移动模式</button>
      <button class="btn small ghost" id="btnZoomOut">－</button>
      <button class="btn small ghost" id="btnZoomIn">＋</button>
      <span class="edit-hint" id="editHint">单指画，双指拖动缩放</span>
    </div>
  </div>
</section>

<nav id="tabbar" class="hidden">
  <button data-go="home" class="tab-btn active">首页</button>
  <button data-go="levels" class="tab-btn">地图</button>
  <button data-go="editor" class="tab-btn">工坊</button>
  <button data-go="leaderboard" class="tab-btn">排行</button>
  <button data-go="profile" class="tab-btn">我的</button>
</nav>

<div id="toast" class="toast"></div>

<canvas id="camCanvas" class="hidden"></canvas>
<input id="avatarFile" type="file" accept="image/*" class="hidden">

<script type="module" src="/js/app.js"></script>
</body>
</html>
